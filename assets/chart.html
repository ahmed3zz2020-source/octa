<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="شارت OCTA — تحليل فني للأسهم المصرية: شموع كاكي، مؤشرات، أدوات رسم، خطوط سعر ووقت، وفريم يومي وأسبوعي وشهري.">
  <title>شارت OCTA — تحليل فني للأسهم المصرية</title>
  <link rel="stylesheet" href="js/chart/styles.css">
</head>

<body class="octa-chart-page">
  <div class="octa-wrap">

    <!-- ══════════ الترويسة ══════════ -->
    <header class="octa-head">
      <h1>شارت <span dir="ltr">OCTA</span></h1>
      <span class="octa-tag">تحليل فني · البورصة المصرية</span>
    </header>

    <!-- ══════════ شريط الأدوات ══════════ -->
    <div class="octa-toolbar">

      <!-- اختيار السهم -->
      <div class="octa-search">
        <label class="octa-sr" for="sym">كود السهم</label>
        <input id="sym" type="text" list="stock-list" placeholder="كود السهم (مثال: COMI)"
          value="COMI" maxlength="12" autocomplete="off" spellcheck="false" dir="ltr">
        <datalist id="stock-list"></datalist>
        <button class="octa-btn" id="go" type="button">تحميل</button>
      </div>

      <!-- الفريم الزمني -->
      <div class="octa-group" role="group" aria-label="الفريم الزمني">
        <span class="octa-group-label">الفريم</span>
        <button class="octa-btn" type="button" data-tf="1D" aria-pressed="true">يومي</button>
        <button class="octa-btn" type="button" data-tf="1W" aria-pressed="false">أسبوعي</button>
        <button class="octa-btn" type="button" data-tf="1M" aria-pressed="false">شهري</button>
      </div>

      <!-- نوع الرسم -->
      <div class="octa-group" role="group" aria-label="نوع الرسم">
        <span class="octa-group-label">النوع</span>
        <button class="octa-btn" type="button" data-type="candles" aria-pressed="true">شموع</button>
        <button class="octa-btn" type="button" data-type="bars" aria-pressed="false">أعمدة</button>
        <button class="octa-btn" type="button" data-type="line" aria-pressed="false">خط</button>
        <button class="octa-btn" type="button" data-type="area" aria-pressed="false">مساحة</button>
        <button class="octa-btn" type="button" data-type="baseline" aria-pressed="false">خط أساسي</button>
        <button class="octa-btn" type="button" data-type="heikin" aria-pressed="false">كاكي</button>
      </div>

    </div>

    <!-- ══════════ شريط أدوات الرسم ══════════ -->
    <div class="octa-toolstrip" id="tools" role="group" aria-label="أدوات الرسم">
      <span class="octa-group-label">الرسم</span>
      <button class="octa-tool" type="button" data-tool="cursor" aria-pressed="true">المؤشر</button>
      <button class="octa-tool" type="button" data-tool="trendline" aria-pressed="false">اتجاه</button>
      <button class="octa-tool" type="button" data-tool="hline" aria-pressed="false">أفقي</button>
      <button class="octa-tool" type="button" data-tool="vline" aria-pressed="false">رأسي</button>
      <button class="octa-tool" type="button" data-tool="rect" aria-pressed="false">مستطيل</button>
      <button class="octa-tool" type="button" data-tool="fib" aria-pressed="false">فيبو</button>
      <button class="octa-tool" type="button" data-tool="measure" aria-pressed="false">مسطرة</button>
      <button class="octa-tool" type="button" data-tool="brush" aria-pressed="false">فرشاة</button>
      <button class="octa-tool" type="button" data-tool="text" aria-pressed="false">نص</button>
      <button class="octa-tool" type="button" data-tool="arrow" aria-pressed="false">سهم</button>
      <button class="octa-tool" type="button" data-tool="flag" aria-pressed="false">علامة</button>
      <button class="octa-tool" type="button" data-tool="priceline" aria-pressed="false">خط سعر</button>
      <button class="octa-tool" type="button" data-tool="timeline" aria-pressed="false">خط وقت</button>
      <span class="octa-sep" aria-hidden="true"></span>
      <button class="octa-tool octa-tool-act" type="button" data-draw="undo" title="تراجع (Ctrl+Z)">تراجع</button>
      <button class="octa-tool octa-tool-act" type="button" data-draw="redo" title="إعادة (Ctrl+Shift+Z)">إعادة</button>
      <button class="octa-tool octa-tool-act" type="button" data-draw="clear" title="مسح كل الرسومات">مسح</button>
      <button class="octa-tool octa-tool-act" type="button" data-draw="lock" aria-pressed="false" title="قفل الطبقة">قفل</button>
      <button class="octa-tool octa-tool-act" type="button" data-draw="magnet" aria-pressed="true" title="المغناطيس (الالتصاق بالأسعار)">مغناطيس</button>
    </div>

    <!-- ══════════ شريط المؤشرات ══════════ -->
    <div class="octa-toolstrip" id="inds" role="group" aria-label="المؤشرات">
      <span class="octa-group-label">المؤشرات</span>
      <button class="octa-tool" type="button" data-ind="sma" aria-pressed="false">SMA</button>
      <button class="octa-tool" type="button" data-ind="ema" aria-pressed="false">EMA</button>
      <button class="octa-tool" type="button" data-ind="wma" aria-pressed="false">WMA</button>
      <button class="octa-tool" type="button" data-ind="hma" aria-pressed="false">HMA</button>
      <button class="octa-tool" type="button" data-ind="dema" aria-pressed="false">DEMA</button>
      <button class="octa-tool" type="button" data-ind="tema" aria-pressed="false">TEMA</button>
      <button class="octa-tool" type="button" data-ind="vwma" aria-pressed="false">VWMA</button>
      <button class="octa-tool" type="button" data-ind="sar" aria-pressed="false">SAR</button>
      <button class="octa-tool" type="button" data-ind="bollinger" aria-pressed="false">بولنجر</button>
      <button class="octa-tool" type="button" data-ind="ichimoku" aria-pressed="false">إيشيموكو</button>
      <span class="octa-sep" aria-hidden="true"></span>
      <button class="octa-tool" type="button" data-ind="rsi" aria-pressed="false">RSI</button>
      <button class="octa-tool" type="button" data-ind="macd" aria-pressed="false">MACD</button>
      <button class="octa-tool" type="button" data-ind="atr" aria-pressed="false">ATR</button>
      <button class="octa-tool" type="button" data-ind="stochastic" aria-pressed="false">ستوكاستيك</button>
      <button class="octa-tool" type="button" data-ind="cci" aria-pressed="false">CCI</button>
      <button class="octa-tool" type="button" data-ind="williamsR" aria-pressed="false">%R</button>
      <button class="octa-tool" type="button" data-ind="adx" aria-pressed="false">ADX</button>
      <button class="octa-tool" type="button" data-ind="obv" aria-pressed="false">OBV</button>
    </div>

    <!-- ══════════ شريط الحالة ══════════ -->
    <div class="octa-status" id="status">
      <div class="octa-status-item">
        <span class="octa-k">السعر</span>
        <span class="octa-v" id="st-price">—</span>
      </div>
      <div class="octa-status-item">
        <span class="octa-k">التغير</span>
        <span class="octa-v octa-flat" id="st-chg">—</span>
      </div>
      <div class="octa-status-item">
        <span class="octa-k">آخر تحديث</span>
        <span class="octa-v" id="st-upd">—</span>
      </div>
    </div>

    <!-- ══════════ الرسائل ══════════ -->
    <div class="octa-msg" id="msg" hidden></div>

    <!-- ══════════ الشارت ══════════ -->
    <div class="octa-chart-box">
      <div class="octa-chart-host" id="chart"></div>
    </div>

    <!-- ══════════ الحفظ ══════════ -->
    <div class="octa-savebox">
      <div class="octa-save-row">
        <input id="ch-name" type="text" maxlength="80" placeholder="اسم الكارت" dir="rtl">
        <input id="ch-note" type="text" maxlength="500" placeholder="ملاحظة" dir="rtl">
        <button class="octa-btn octa-btn-main" id="ch-save" type="button">حفظ</button>
        <button class="octa-btn" id="ch-png" type="button">صورة PNG</button>
      </div>
      <div class="octa-chlist" id="ch-list"></div>
    </div>

    <!-- ══════════ التذييل ══════════ -->
    <footer class="octa-foot">
      <a class="octa-tv" id="tv" href="https://www.tradingview.com/chart/" target="_blank"
        rel="noopener noreferrer">افتح في <span dir="ltr">TradingView</span> (مقارنة)</a>
      <span>المصدر: بيانات البورصة المصرية عبر واجهة <span dir="ltr">OCTA</span></span>
      <a href="../index.html">رجوع للرئيسية</a>
    </footer>

  </div>

  <!-- ══════════ السكربتات (كلها محلية — مافيش CDN) ══════════ -->
  <script src="js/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="js/octa-api.js"></script>
  <script src="js/chart/data.js"></script>
  <script src="js/chart/indicators.js"></script>
  <script src="js/chart/core.js"></script>
  <script src="js/chart/gestures.js"></script>
  <script src="js/chart/draw.js"></script>
  <script src="js/chart/storage.js"></script>
  <script src="js/octa-chart-pro.js"></script>

</body>

</html>
