<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="شارت OCTA — تحليل فني للأسهم المصرية على TradingView: شموع كاكي، مؤشرات، أدوات رسم، وفريم يومي وأسبوعي وشهري.">
  <title>شارت OCTA — تحليل فني للأسهم المصرية</title>
  <link rel="icon" type="image/png" href="/assets/octa-logo.png">
  <link rel="stylesheet" href="/assets/octa-tokens.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--pri); color: var(--txt);
      font-family: "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 14px 40px; }

    /* ── الترويسة ── */
    .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .head h1 { font-size: 1.35rem; margin: 0; font-weight: 800; }
    .head h1 span { color: var(--gold); }
    .tag {
      font-size: .74rem; color: var(--muted); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 12px;
    }
    .head .sp { flex: 1; }

    /* ── شريط الأدوات ── */
    .bar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      background: var(--pri2); border: 1px solid var(--line);
      border-radius: 14px; padding: 10px 12px; margin-bottom: 12px;
    }
    .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .glabel { font-size: .74rem; color: var(--muted); margin-inline-end: 2px; }
    .inp {
      background: var(--pri3); border: 1px solid var(--line2); color: var(--txt);
      border-radius: 10px; padding: 9px 12px; font-size: .9rem; min-height: 42px;
      min-width: 130px; font-family: inherit;
    }
    .inp:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .btn {
      background: var(--pri3); border: 1px solid var(--line2); color: var(--txt);
      border-radius: 10px; padding: 9px 16px; font-size: .84rem; font-weight: 700;
      cursor: pointer; min-height: 42px; font-family: inherit;
    }
    .btn:hover { border-color: var(--goldLine2); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn.main { background: var(--goldBg); border-color: var(--goldLine2); color: var(--gold); }
    .btn[aria-pressed="true"] { background: var(--goldBg); border-color: var(--goldLine2); color: var(--gold); }

    /* ── الشارت ── */
    .chartbox {
      background: var(--pri2); border: 1px solid var(--line);
      border-radius: 14px; overflow: hidden; position: relative;
    }
    .charthost { position: relative; width: 100%; height: min(70vh, 620px); min-height: 380px; }
    .charthost iframe { display: block; width: 100%; height: 100%; border: 0; }
    .octa-tv-open {
      display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
      color: var(--gold); border: 1px solid var(--goldLine2); background: var(--goldBg);
      border-radius: 10px; padding: 8px 14px; font-size: .8rem; font-weight: 800;
      margin: 10px 0 0;
    }
    .tvbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 2px; }
    .tvbar .src { font-size: .74rem; color: var(--muted); }
    .msg {
      padding: 10px 14px; border-radius: 10px; font-size: .84rem; margin-bottom: 10px;
      background: rgba(220, 38, 38, .12); border: 1px solid rgba(220, 38, 38, .4);
      color: #fca5a5;
    }
    .msg[hidden] { display: none; }
    .foot {
      display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
      margin-top: 16px; font-size: .78rem; color: var(--muted);
    }
    .foot a { color: var(--gold); text-decoration: none; }
    @media (max-width: 620px) {
      .charthost { height: 62vh; min-height: 320px; }
      .wrap { padding: 12px 10px 30px; }
    }
  </style>
  <style>
    /* 19 أكتوبر ٢٠٢٦ — صف السعر اللحظي في ترويسة /chart */
    .ocm-row1 {
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap; margin-bottom: 12px;
      background: var(--pri2, #0a1929);
      border: 1px solid var(--line, rgba(255,255,255,.09));
      border-radius: 12px; padding: 10px 14px;
    }
    .ocm-title { font-weight: 800; font-size: 1rem; color: var(--txt, #e8eef5); }
    .ocm-code {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem;
      font-weight: 800; color: var(--gold, #d4af37);
      background: var(--goldBg, rgba(212,175,55,.12));
      border: 1px solid var(--goldLine, rgba(212,175,55,.32));
      border-radius: 8px; padding: 3px 9px; direction: ltr;
    }
    .ocm-price {
      display: inline-flex; align-items: baseline; gap: 6px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 1.05rem; font-weight: 800; color: var(--txt, #e8eef5);
      direction: ltr; margin-inline-start: auto;
    }
    .ocm-change { font-size: .78rem; padding: 2px 7px; border-radius: 6px; }
    .ocm-change.up { background: rgba(20,180,90,.18); color: #2cd17e; }
    .ocm-change.down { background: rgba(220,40,40,.18); color: #ff6e6e; }
    .ocm-change.flat { background: rgba(150,150,150,.15); color: #b0b0b0; }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="head">
      <h1>شارت <span dir="ltr">OCTA</span></h1>
      <span class="tag">تحليل فني · البورصة المصرية</span>
      <span class="sp"></span>
      <a class="btn" href="../index.html">رجوع للرئيسية</a>
    </header>

    <div class="ocm-row1" id="chart-head">
      <span class="ocm-title" id="ch-title">البنك التجاري الدولي - مصر</span>
      <span class="ocm-code" id="ch-code">EGX:COMI</span>
      <span class="ocm-price" id="ch-price-box" data-pending="1"><span id="ch-price-v"></span><span class="ocm-change" id="ch-price-c"></span></span>
    </div>

    <div class="msg" id="msg" hidden></div>

    <div class="bar">
      <div class="group">
        <label class="glabel" for="sym">كود السهم</label>
        <input id="sym" class="inp" type="text" list="stock-list" placeholder="COMI" maxlength="12"
          value="COMI" autocomplete="off" spellcheck="false" dir="ltr">
        <datalist id="stock-list"></datalist>
        <button class="btn main" id="go" type="button">تحميل</button>
      </div>
      <div class="group" role="group" aria-label="الفريم الزمني">
        <span class="glabel">الفريم</span>
        <button class="btn" type="button" data-tf="5">٥د</button>
        <button class="btn" type="button" data-tf="15">١٥د</button>
        <button class="btn" type="button" data-tf="60">ساعة</button>
        <button class="btn" type="button" data-tf="1D" aria-pressed="true">يوم</button>
        <button class="btn" type="button" data-tf="1W">أسبوع</button>
        <button class="btn" type="button" data-tf="1M">شهر</button>
      </div>
    </div>

    <div class="chartbox">
      <div class="charthost" id="chart"></div>
    </div>

    <div class="tvbar">
      <span class="src">المصدر: TradingView · بيانات البورصة المصرية (EGX)</span>
    </div>

    <footer class="foot">
      <a id="tv" href="https://www.tradingview.com/chart/" target="_blank" rel="noopener noreferrer">
        افتح في <span dir="ltr">TradingView</span> (مقارنة)
      </a>
      <span>تصميم وتنفيذ المهندس أحمد عز</span>
    </footer>

  </div>

  <script src="js/tv-shim.js?v=2026102901"></script>
  <script>
    /* ═══ نفس وضع الموقع (فاتح/داكن/تلقائي) — من localStorage ═══ */
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('octa_theme') || 'auto'; } catch (e) { }
      if (t === 'auto') {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
        t = (mq && mq.matches) ? 'light' : 'dark';
      }
      var lt = (t === 'light');
      document.body.classList.toggle('light', lt);
      document.documentElement.classList.toggle('light', lt);
      document.documentElement.setAttribute('data-theme', lt ? 'light' : 'dark');
    })();
  </script>
  <script>
    (function () {
      'use strict';
      var host = document.getElementById('chart');
      var msg = document.getElementById('msg');
      var tvLink = document.getElementById('tv');
      var symInput = document.getElementById('sym');
      var codeEl = document.getElementById('ch-code');
      var tf = '1D';

      function say(t) {
        if (!msg) return;
        if (!t) { msg.hidden = true; msg.textContent = ''; return; }
        msg.hidden = false;
        msg.textContent = t;
      }

      function norm(s) {
        s = String(s || '').trim().toUpperCase();
        if (!s) return '';
        if (s.indexOf(':') > 0) return s;
        return 'EGX:' + s;
      }

      function load(code) {
        var sym = norm(code || symInput.value);
        if (!sym) { say('اكتب كود السهم الأول.'); return; }
        say('');
        symInput.value = sym.indexOf(':') > 0 ? sym.split(':')[1] : sym;
        if (codeEl) codeEl.textContent = sym;
        tvLink.href = 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(sym);
        try {
          window.OCTA_TV.whenSized(host, function () {
            window.OCTA_TV.mount(host, { symbol: sym, interval: tf });
          });
        } catch (e) {
          say('مقدرناش نفتح الشارت دلوقتي.');
        }
      }

      document.getElementById('go').addEventListener('click', function () { load(); });
      symInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); load(); }
      });

      document.querySelectorAll('[data-tf]').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('[data-tf]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          tf = b.getAttribute('data-tf');
          load();
        });
      });

      /* قائمة الأسهم — من ملف البيانات المحلي */
      try {
        fetch('/data/data_markets.js').then(function (r) { return r.text(); }).then(function (t) {
          var m = t.match(/[A-Z]{2,6}/g) || [];
          var seen = {}, out = '';
          m.slice(0, 400).forEach(function (c) {
            if (seen[c] || c.length > 6) return;
            seen[c] = 1;
            out += '<option value="' + c + '">';
          });
          var dl = document.getElementById('stock-list');
          if (dl) dl.innerHTML = out;
        }).catch(function () {});
      } catch (e) {}

      load('COMI');
    })();

    /* 19 أكتوبر ٢٠٢٦ — السعر اللحظي (legend) */
    (function () {
      var priceEl = document.getElementById('ch-price-v');
      var chgEl = document.getElementById('ch-price-c');
      var titleEl = document.getElementById('ch-title');
      var codeEl = document.getElementById('ch-code');
      var priceBox = document.getElementById('ch-price-box');
      var symInput = document.getElementById('sym');
      if (!priceEl || !chgEl) return;
      var API = '';  /* same-origin: /api/stocks → worker proxy */
      function fmt(n) { if (n == null || isNaN(n)) return '—'; return Number(n).toFixed(2); }
      function update() {
        fetch(API + '/api/stocks', { credentials: 'omit' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (!d) return;
            var all = [].concat(d.egx30 || [], d.egx70 || [], d.egx33 || [], d.egx100 || [], d.amwal || [], d.dawabet || []);
            var cur = (symInput && symInput.value || 'COMI').toUpperCase();
            var stk = all.find(function (s) { return s && (s.code || '').toUpperCase() === cur; });
            if (!stk) return;
            if (titleEl) titleEl.textContent = '📈 ' + (stk.name || cur);
            if (priceEl) priceEl.textContent = fmt(stk.price) + ' EGP';
            if (chgEl) {
              var ch = stk.change;
              chgEl.textContent = (ch > 0 ? '▲ +' : ch < 0 ? '▼ ' : 'ـ ') + fmt(ch) + '%';
              chgEl.className = 'ocm-change ' + (ch > 0 ? 'up' : ch < 0 ? 'down' : 'flat');
            }
            if (priceBox) priceBox.removeAttribute('data-pending');
          }).catch(function () {});
      }
      
      update();
      if (window.__chPriceTimer) clearInterval(window.__chPriceTimer);
      window.__chPriceTimer = setInterval(update, 15000);
    })();
  </script>

</body>

</html>
