<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OCTA — لوحة الإدارة | دخول</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#081521">
<link rel="icon" href="/icons/favicon.png" type="image/png">
<style>
:root{
  --bg:#081521; --bg2:#0a1929; --card:#0e2135; --card2:#122a42;
  --line:#1d3a58; --line2:#2a5075; --txt:#e8eef5; --dim:#8b9eb0; --dim2:#5f7186;
  --gold:#d4af37; --gold2:#f4d03f; --teal:#16c79a; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(900px 600px at 50% -10%,#123049 0%,transparent 60%),var(--bg);
  color:var(--txt);font-family:'Cairo','Tajawal',system-ui,-apple-system,sans-serif;
  display:grid;place-items:center;padding:24px 18px;line-height:1.7;
}
.card{
  width:100%;max-width:400px;background:linear-gradient(160deg,var(--card2),var(--card));
  border:1px solid var(--line2);border-radius:20px;padding:30px 24px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
}
.lg{
  width:62px;height:62px;border-radius:17px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),#8a6d12);color:#081521;font-weight:900;font-size:23px;
  box-shadow:0 8px 26px rgba(212,175,55,.3);
}
h1{font-size:19px;font-weight:900;margin-bottom:6px}
.sb{color:var(--dim);font-size:12.5px;margin-bottom:20px;font-weight:600}
label{display:block;text-align:right;font-size:12px;font-weight:800;color:var(--dim);margin-bottom:6px}
input{
  width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--txt);border-radius:12px;
  padding:14px 15px;font-family:inherit;font-size:16px;outline:none;text-align:center;letter-spacing:2px;
}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
button{
  width:100%;margin-top:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#a5821c);color:#081521;border:0;border-radius:12px;
  font-family:inherit;
}
button:disabled{opacity:.6;cursor:progress}
.msg{min-height:22px;margin-top:10px;font-size:13px;font-weight:700;color:var(--red)}
.msg.ok{color:var(--teal)}
.tip{color:var(--dim2);font-size:11.5px;margin-top:16px;line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
.lock{display:inline-block;margin-bottom:10px;font-size:26px}
@media(min-width:520px){ .card{padding:36px 30px} }
</style>
</head>
<body>
  <main class="card">
    <div class="lg">O</div>
    <div class="lock">🔒</div>
    <h1>لوحة إدارة OCTA</h1>
    <div class="sb">الدخول مطلوب عشان تشوف البيانات</div>
    <form id="loginForm" autocomplete="off">
      <label for="pw">كلمة المرور</label>
      <input type="password" id="pw" name="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">دخول</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="tip">
      ⛔ الصفحة دي public — مافيش فيها أي بيانات.<br>
      🔐 كل صفحة تانية في اللوحة محمية بجلسة (كوكي HttpOnly + SameSite=Strict).
    </div>
  </main>

<script>
(function () {
  'use strict';
  var f = document.getElementById('loginForm');
  var pw = document.getElementById('pw');
  var btn = document.getElementById('loginBtn');
  var msg = document.getElementById('msg');

  function nextUrl() {
    try {
      var p = new URLSearchParams(location.search).get('next') || '/';
      if (p.charAt(0) !== '/' || p.slice(0, 2) === '//') return '/';
      return p;
    } catch (e) { return '/'; }
  }

  function say(t, ok) {
    msg.textContent = t || '';
    msg.className = 'msg' + (ok ? ' ok' : '');
  }

  /* ⛔ لو فيه جلسة سارية ⇒ ادخل على طول */
  fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { if (r.ok) location.replace(nextUrl()); })
    .catch(function () { });

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
    say('');
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw.value }),
      credentials: 'same-origin'
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok) {
        say(res.j && res.j.error ? res.j.error : 'كلمة المرور غلط');
        pw.value = ''; pw.focus();
        btn.disabled = false; btn.textContent = 'دخول';
        return;
      }
      say('تم الدخول — جاري الفتح…', true);
      location.replace(nextUrl());
    }).catch(function () {
      say('تعذّر الاتصال بالسيرفر — جرّب تاني');
      btn.disabled = false; btn.textContent = 'دخول';
    });
  });
})();
</script>
</body>
</html>
