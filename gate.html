<script id="octaSwGuard">
/* ⭐⭐⭐ ٩ نوفمبر ٢٠٢٦ — «مفتاح إطفاء» Service Worker (تسجيل مبكر)
   📌 السبب: التطبيق المثبّت (WebAPK) كان بيفتح **شاشة بيضا** بعد
     «تحديث دلوقتي» (الـSW القديم كان ماسك والكاش اتمسح).
   ✅ الحل: نسجّل `/sw.js` (مفيش fetch handler ⇒ كل الطلبات بتعدّي
     للشبكة) **بس لو فيه SW فعلي** ⇒ الـSW القديم يتستبدل من أول فتح
     ⇒ وبعدها المفتاح بيلغي نفسه ويمسح الكاش ⇒ وضع المتصفح العادي.
   📌 لازم في **كل** الصفحات — حتى بوابة الدخول ⭐ (لو البوابة
     مش بتتحمّل ⇒ المستخدم مش هيقدر يدخل خالص!). */
(function () {
  try {
    if (!('serviceWorker' in navigator)) return;
    if (window.__octaSwGuardDone) return;
    window.__octaSwGuardDone = 1;
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      if (!rs || !rs.length) return;
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () { });
    }).catch(function () { });
  } catch (e) { }
})();
</script>
<script>
  /* ⛔ صفحة البوابة: بعد الدخول بنحوّل على التطبيق
     (الـWorker سيبعت التطبيق كمان — الكوكي بقى موجود).

     ⛔⛔ مهم — لازم الكوكي يكون موجود **قبل** التحويل:
     ⛌ الـWorker بيفحص كوكي الجلسة. لو حوّلنا والكوكي لسه
     ⛌ ما اتحفظش (لأن الـAPI القديم مش بيرجّع Set-Cookie) ⇒
     ⛌ البوابة هترجع تاني… للأبد.
     ⛌ الحل: /api/auth/refresh بيرجّع كوكي جديد مع كل رد.
     ⛌ (الكوكي HttpOnly ⇒ JS مش شايفه — فبنعمل ده قبل التحويل.) */
  window.OCTA_GATE_PAGE = true;

  function octaGateReady(cb) {
    var t = '';
    try { t = localStorage.getItem('octa_token') || ''; } catch (e) { }
    if (!t) { cb(); return; }
    try {
      fetch('/api/auth/refresh', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Authorization': 'Bearer ' + t }
      }).then(function () { cb(); }, function () { cb(); });
    } catch (e) { cb(); }
  }

  window.OCTA_GATE_REDIRECT = function () {
    octaGateReady(function () { location.replace('/'); });
  };
</script>
